# AmazingHand AI — host 侧配置（数据与代码分离，architecture.md 规则 4）
# 修改后无需改代码；后端切换 = 改 backend 一行

backend: sim          # sim | serial | fpga（PC 冒烟用 sim；板端 serial/fpga）

# BGR factory compatibility profile retained from round 1. The optimized standalone
# host/camera_linux/live_vision.py uses its own CLI defaults, not this YAML.
# It never starts hand control; settings here do not connect vision to the FSM.
camera:
  type: preview_http
  url: http://127.0.0.1:9000
  max_age_ms: 800
  timeout_s: 2

vision:
  backend: ncnn_cpp
  conf_threshold: 0.35
  iou_threshold: 0.45
  ncnn:
    model_dir: /opt/amazinghand/live-vision-20261018/models
    executable: /opt/amazinghand/live-vision-20261018/native-openmp/bridge/ah_ncnn_bridge
    input_size: 416
    num_threads: 3  # leave CPU capacity for the independent HD camera service

serial:
  port: /dev/ttyUSB0  # Waveshare 总线驱动板（软件环后端）
  baudrate: 1000000   # SCS0009 固定 1Mbps
  timeout_s: 0.05     # 单帧响应超时

fpga:
  axi_base: "0x40000000"  # AXI4-Lite 基地址（interface.md §1）
  poll_period_units: 10   # 轮询周期 = 10×0.1ms = 1kHz（interface.md §6）

servo:
  ids: [1, 2, 3, 4, 5, 6, 7, 8]  # 食(1,2) 中(3,4) 无名(5,6) 拇(7,8)，官方映射
  # 机械中位（度，待实机标定 data/calibration/servo_map；当前=官方 Demo 示例值）
  middle_pos_deg: [3, 0, -5, -8, -2, 5, -12, 0]

strategy:
  table: grasp_table.json  # 相对 host/app/strategy/；抓取参数表

app:
  tick_hz: 100             # 主循环节拍（模拟后端动力学推进）
  recognize_timeout_s: 5   # 识别超时
  guide_timeout_s: 30      # ArUco 就位引导超时（F2 验收 ≤30s）
