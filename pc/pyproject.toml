[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visiongrasp-pc"
version = "0.1.0"
description = "Offline-first PC vision and RoArm adapter demo"
requires-python = ">=3.10,<3.11"
dependencies = ["numpy==1.26.4", "opencv-python==4.10.0.84", "pyserial==3.5", "requests", "simplejson"]

[tool.setuptools.packages.find]
where = ["."]
include = ["visiongrasp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

